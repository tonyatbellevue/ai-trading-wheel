name: TSLA Wheel Strategy

# Triggering: workflow_dispatch only. cron-job.org fires this every 8 min
# during market hours (`*/8 13-20 * * 1-5` UTC = ET 09-16:00 weekdays).
# Reasons GHA `schedule:` block was removed:
#
#   - Free-tier GHA scheduled cron is wildly unreliable. On 5/5 only 6 of
#     90 expected fires actually ran (7%) — bot saw ~6 chances to act
#     instead of 90.
#   - workflow_dispatch is treated as user-initiated and runs on time.
#   - Repo is public so GHA Action minutes are unlimited; no quota concern
#     even at 64 dispatches/day.
#
# Backup: `gh workflow run wheel.yml --ref master` for manual single-fire.
on:
  workflow_dispatch:           # cron-job.org fires this; same PAT as wheel-summary

# Serialize all wheel cycle runs — without this a slow cron (>5min) gets
# overlapped by the next 5-min trigger, both pass the IDLE check, both
# call select_put + sell_to_open, and we get DUPLICATE orders that bust
# the 40% / 60% / 90% caps. cancel-in-progress=false means the second
# run waits politely instead of killing the first one mid-trade.
concurrency:
  group: wheel-cycle
  cancel-in-progress: false

jobs:
  run-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: write    # 允许推送 wheel_symbol.json 状态更新

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Wheel cycle
        id: wheel
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets/v2"
          PAPER_TRADING: "true"
          # EMAIL secrets needed for the trade-alert email path in
          # wheel_once.py — fires only when a NEW order is placed (rare,
          # so no spam risk). Idempotency is via set-difference within
          # the single run; cross-runner state is not needed.
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python wheel_once.py

      - name: Check for trade
        id: check
        run: |
          if [ -f trade.flag ]; then
            echo "traded=true" >> $GITHUB_OUTPUT
            echo "title=[Trade] TSLA Wheel — $(date -u +%Y-%m-%d_%H:%M)_UTC" >> $GITHUB_OUTPUT
          else
            echo "traded=false" >> $GITHUB_OUTPUT
          fi

      - name: Create trade notification issue
        if: steps.check.outputs.traded == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: ${{ steps.check.outputs.title }}
          content-filepath: ./summary.md
          labels: |
            wheel-trade
            automated

      - name: Commit wheel_symbol.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain wheel_symbol.json)" ]; then
            git add wheel_symbol.json
            git commit -m "chore: auto-update wheel_symbol.json [skip ci]"
            git push
          else
            echo "wheel_symbol.json unchanged"
          fi
