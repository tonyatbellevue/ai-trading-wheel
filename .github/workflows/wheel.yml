name: TSLA Wheel Strategy

# 每5分钟运行一次（周一至周五，美东时间 9:30~16:00）
# EDT = UTC-4, 13:30~20:00 UTC
on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch:

jobs:
  run-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: write    # 允许推送 wheel_symbol.json 状态更新

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Wheel cycle
        id: wheel
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets/v2"
          PAPER_TRADING: "true"
          # Wheel cycle also acts as a piggyback trigger for OPEN/CLOSE
          # emails — wheel-summary.yml's hourly cron is unreliable on GHA
          # free tier (we've seen 1-2h delays and outright misses), so
          # this 5-min cron does a windowed idempotent re-check.
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python wheel_once.py

      - name: Check for trade
        id: check
        run: |
          if [ -f trade.flag ]; then
            echo "traded=true" >> $GITHUB_OUTPUT
            echo "title=[Trade] TSLA Wheel — $(date -u +%Y-%m-%d_%H:%M)_UTC" >> $GITHUB_OUTPUT
          else
            echo "traded=false" >> $GITHUB_OUTPUT
          fi

      - name: Create trade notification issue
        if: steps.check.outputs.traded == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: ${{ steps.check.outputs.title }}
          content-filepath: ./summary.md
          labels: |
            wheel-trade
            automated

      - name: Commit wheel_symbol.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain wheel_symbol.json)" ]; then
            git add wheel_symbol.json
            git commit -m "chore: auto-update wheel_symbol.json [skip ci]"
            git push
          else
            echo "wheel_symbol.json unchanged"
          fi
