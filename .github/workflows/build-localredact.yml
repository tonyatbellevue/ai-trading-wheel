# Builds LocalRedact.exe on a real Windows runner and publishes it as a
# downloadable artifact.
#
# PyInstaller cannot cross-compile, so a Windows .exe has to be produced on
# Windows. This workflow is the supported way to get one without needing a
# Windows machine to hand; `pdf_redactor/packaging/build_exe.bat` does the same
# thing locally.
#
# Scoped to pdf_redactor/** so it never runs for trading-bot changes.

name: Build LocalRedact.exe

on:
  # Defining a `tags:` filter alongside `paths:` stopped branch pushes from
  # triggering this at all - GitHub skips ref types the filter does not define,
  # and a tag push has no path diff to match. Releases are therefore published
  # from an explicit manual run instead, which is also easier to review.
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Also publish a GitHub Release with the exe'
        type: boolean
        default: false
      release_tag:
        description: 'Tag for that release, e.g. localredact-v1.0.0'
        type: string
        default: ''
  push:
    paths:
      - 'pdf_redactor/**'
      - '.github/workflows/build-localredact.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdf_redactor
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF==1.28.2 pyinstaller==6.16.0

      - name: Confirm Tkinter is present
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Run the engine test suite
        run: python tests\test_localredact.py

      - name: Run the headless GUI checks
        run: python tests\smoke_gui_headless.py

      - name: Check the icon generator and the committed icon
        run: |
          python packaging\make_icon.py
          python packaging\make_icon.py --check

      - name: Build the executable
        run: pyinstaller packaging\localredact.spec --noconfirm

      - name: Verify the executable
        run: |
          $exe = "dist\LocalRedact.exe"
          if (-not (Test-Path $exe)) { Write-Error "exe was not produced"; exit 1 }
          $item = Get-Item $exe
          Write-Host ("Size: {0:N1} MB" -f ($item.Length / 1MB))
          $info = $item.VersionInfo
          Write-Host "ProductName:     $($info.ProductName)"
          Write-Host "FileDescription: $($info.FileDescription)"
          Write-Host "FileVersion:     $($info.FileVersion)"
          if ($info.ProductName -ne 'LocalRedact') {
            Write-Error "version resource missing from the exe"; exit 1
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($item.FullName)
          if ($null -eq $icon) { Write-Error "no icon embedded in the exe"; exit 1 }
          Write-Host "Embedded icon: $($icon.Width)x$($icon.Height)"

      - name: End-to-end redaction check on Windows
        run: python tests\ci_windows_e2e.py

      - name: Upload LocalRedact.exe
        uses: actions/upload-artifact@v4
        with:
          name: LocalRedact-windows-exe
          path: |
            pdf_redactor/dist/LocalRedact.exe
            pdf_redactor/packaging/localredact.ico
          if-no-files-found: error
          retention-days: 90

  # Separate job so the build job above, which runs on every push, keeps a
  # read-only token. Only an explicit manual run with publish_release ticked
  # reaches this one, and only this one can write to the repository.
  release:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_release &&
      inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LocalRedact-windows-exe
          path: artifact

      - name: Record the SHA-256 of the exe
        run: |
          cd artifact/dist
          sha256sum LocalRedact.exe | tee SHA256SUMS.txt

      - name: Publish the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          files: |
            artifact/dist/LocalRedact.exe
            artifact/dist/SHA256SUMS.txt
          body: |
            LocalRedact - fully offline PDF redaction for Windows.

            `LocalRedact.exe` is a single self-contained file; the target machine
            needs no Python and no installer. Verify it against `SHA256SUMS.txt`.

            Install (no administrator rights required):

                .\packaging\install.ps1 -Source C:\path\to\LocalRedact.exe

            The exe is unsigned, so SmartScreen warns on first run: choose
            "More info" then "Run anyway". See docs/INSTALL_WINDOWS.md.

            This build passed, on the Windows runner: the engine test suite, the
            headless GUI checks, and an end-to-end redaction whose output was
            searched byte-for-byte (ASCII, hex and UTF-16) for the values it had
            removed.
          draft: false
