name: Wheel Daily Email Summary

# Goal: exactly ONE open + ONE close email per US trading day.
#
# Triggering: this workflow now runs ONLY via workflow_dispatch. The
# Cloudflare Worker in cf-worker/ fires the dispatch at the precise
# OPEN/CLOSE moments (13:31 UTC and 20:05 UTC, ±5s). Reasons the GHA
# `schedule:` block was removed:
#
#   - Free-tier GHA scheduled cron is delayed 1-2h regularly, so emails
#     arrived late or were dropped entirely.
#   - Keeping `schedule:` alongside the CF dispatch caused duplicate
#     emails: the delayed scheduled run on a different runner couldn't
#     see the dispatch's `daily_sent_state.json` (per-runner local) and
#     would re-send.
#
# Backup paths if the CF Worker is down:
#   - Manual: `gh workflow run wheel-summary.yml --ref master`
#   - CF Worker also exposes /?dispatch=1 as a manual smoke-test endpoint.
#
# Holiday/weekend skip lives in email_summary.py via Alpaca's calendar,
# so a stray dispatch on a market-closed day no-ops cleanly.
on:
  workflow_dispatch:          # CF Worker triggers this; bypasses idempotency, always sends

jobs:
  email-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine event type (open/close)
        id: event
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt "16" ]; then
            echo "event=open" >> $GITHUB_OUTPUT
          else
            echo "event=close" >> $GITHUB_OUTPUT
          fi

      - name: Send email summary
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets/v2"
          PAPER_TRADING: "true"
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          # Manual run forces send; scheduled runs honor idempotency.
          WHEEL_EMAIL_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python email_summary.py ${{ steps.event.outputs.event }}

      - name: Upload summary artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ steps.event.outputs.event }}-${{ github.run_id }}
          path: summary.md
          if-no-files-found: ignore
          retention-days: 14
