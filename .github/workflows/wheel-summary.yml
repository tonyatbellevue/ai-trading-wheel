name: Wheel Daily Email Summary

# Goal: exactly ONE open + ONE close email per US trading day.
#
# Architecture (simplified after the 4/30 incident where 3 redundant
# crons all fired within 3 min of each other and concurrency lock failed
# to dedupe, sending 2 emails for one event):
#
#   - One cron per event in this workflow (OPEN at 13:31 UTC, CLOSE at
#     20:05 UTC). Free-tier GHA delays these by 1-2h regularly, but
#     that's OK because of the backup below.
#   - The REAL reliability comes from wheel.yml's 5-min cron, which
#     calls email_summary.py inside an OPEN/CLOSE window check (see
#     wheel_once.py:_maybe_send_scheduled_email). That cron almost
#     never gets dropped.
#   - Idempotency is enforced in email_summary.py via the local
#     daily_sent_state.json file. As long as the same runner sees a
#     prior send within the same day, it skips. Cross-runner state
#     persistence isn't worth the complexity it added.
#
# Holiday/weekend skip lives in email_summary.py via Alpaca's calendar.
on:
  schedule:
    - cron: "31 13 * * 1-5"   # OPEN  — 9:31 ET / 21:31 SGT
    - cron: "5 20 * * 1-5"    # CLOSE — 16:05 ET / 04:05 SGT (next day)
  workflow_dispatch:          # manual — bypasses idempotency, always sends

jobs:
  email-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine event type (open/close)
        id: event
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt "16" ]; then
            echo "event=open" >> $GITHUB_OUTPUT
          else
            echo "event=close" >> $GITHUB_OUTPUT
          fi

      - name: Send email summary
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets/v2"
          PAPER_TRADING: "true"
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          # Manual run forces send; scheduled runs honor idempotency.
          WHEEL_EMAIL_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python email_summary.py ${{ steps.event.outputs.event }}

      - name: Upload summary artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ steps.event.outputs.event }}-${{ github.run_id }}
          path: summary.md
          if-no-files-found: ignore
          retention-days: 14
