name: Wheel Daily Email Summary

# GitHub Actions cron on free tier is unreliable — scheduled runs are
# regularly delayed or outright skipped under load. We fire each event
# THREE times ~5-10 min apart as belt-and-suspenders redundancy. The
# Python entrypoint writes an "already sent today" flag and silently
# returns on subsequent calls, so we get at most one email per event.
#
# Market open  9:31 AM ET = 13:31 UTC
# Market close 4:05 PM ET = 20:05 UTC
# Mon-Fri only
on:
  schedule:
    - cron: "31 13 * * 1-5"   # OPEN  — primary
    - cron: "36 13 * * 1-5"   # OPEN  — +5 min backup
    - cron: "41 13 * * 1-5"   # OPEN  — +10 min backup
    - cron: "5 20 * * 1-5"    # CLOSE — primary
    - cron: "10 20 * * 1-5"   # CLOSE — +5 min backup
    - cron: "15 20 * * 1-5"   # CLOSE — +10 min backup
  workflow_dispatch:          # 手动触发（忽略幂等锁，总是发送）

jobs:
  email-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine event type (open/close)
        id: event
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt "16" ]; then
            echo "event=open" >> $GITHUB_OUTPUT
          else
            echo "event=close" >> $GITHUB_OUTPUT
          fi

      - name: Send email summary
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: "https://paper-api.alpaca.markets/v2"
          PAPER_TRADING: "true"
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          # workflow_dispatch bypasses idempotency so manual re-runs always send;
          # scheduled runs honor the daily "already sent" flag so 3 crons = 1 email
          WHEEL_EMAIL_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python email_summary.py ${{ steps.event.outputs.event }}

      - name: Upload summary artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ steps.event.outputs.event }}-${{ github.run_id }}
          path: summary.md
          if-no-files-found: ignore
          retention-days: 14
